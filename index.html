<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogos | Vanessa Pessanha Acessórios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#1a1410">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>

  <header class="header">
    <img src="img/logo.png" alt="Logo Vanessa Pessanha" class="header-logo" onerror="this.style.display='none'">
    <div class="header-text">
      <h1>Catálogos</h1>
      <p>Vanessa Pessanha Acessórios</p>
    </div>
    <a class="whatsapp-btn" href="https://wa.me/55" target="_blank" title="Fale no WhatsApp">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </a>
  </header>

  <main class="main">
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Carregando catálogos…</p>
    </div>
    <div id="empty" class="empty-state" style="display:none">
      <span class="empty-icon">📂</span>
      <p>Nenhum catálogo encontrado</p>
      <small>Adicione PDFs na pasta <code>catalogos/</code> e registre-os neste arquivo.</small>
    </div>
    <div id="shelf" class="shelf"></div>
  </main>

  <div id="modal" class="modal" style="display:none" role="dialog" aria-modal="true">
    <div class="modal-header">
      <button id="modalClose" class="btn-icon-action" title="Fechar">&#10005;</button>
      <span id="modalTitle" class="modal-title"></span>
      <a id="modalDownload" class="btn-icon-action" title="Baixar PDF" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="17" height="17"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </a>
    </div>
    <div class="viewer-toolbar">
      <button id="btnPrev" class="nav-btn" disabled>&#8249;</button>
      <span class="page-info"><span id="pageNum">1</span>&nbsp;/&nbsp;<span id="pageTotal">1</span></span>
      <button id="btnNext" class="nav-btn">&#8250;</button>
      <div class="zoom-group">
        <button id="btnZoomOut" class="zoom-btn">&#8722;</button>
        <button id="btnFit"     class="zoom-btn" title="Ajustar">&#8861;</button>
        <button id="btnZoomIn"  class="zoom-btn">&#43;</button>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="pdfCanvas"></canvas>
      <div id="renderSpinner" class="render-spinner" style="display:none"><div class="spinner small"></div></div>
    </div>
    <p class="swipe-hint" id="swipeHint">&#8592; Deslize para navegar &#8594;</p>
  </div>
  <div id="modalOverlay" class="modal-overlay" style="display:none"></div>

  <script type="module">
    import * as pdfjsLib from './libs/pdfjs/pdf.js';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './libs/pdfjs/pdf.worker.js';

    /* ================================================
       LISTA DE CATALOGOS
       Para adicionar um novo catalogo:
         1. Coloque o PDF na pasta /catalogos/
         2. Adicione uma linha abaixo
       ================================================ */
    const catalogos = [
      { file: 'colecao-amor-e-fe.pdf',  title: 'Colecao Amor e Fe'   },
      { file: 'colecao-amor-e-fe2.pdf', title: 'Colecao Amor e Fe 2' }
    ];
    const pdfDir = 'catalogos/';

    let currentPdf  = null, currentPage = 1, totalPages = 1;
    let curScale = 1.0, renderTask = null, touchX0 = 0;
    const $ = id => document.getElementById(id);

    async function buildShelf() {
      await Promise.all(catalogos.map(buildCard));
      $('loading').style.display = 'none';
      if (!catalogos.length) $('empty').style.display = 'flex';
    }

    async function buildCard(cat) {
      const url  = pdfDir + cat.file;
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role','button');
      card.setAttribute('tabindex','0');
      card.innerHTML = `
        <div class="card-thumb-wrap">
          <canvas class="card-thumb"></canvas>
          <span class="card-badge">PDF</span>
        </div>
        <div class="card-info">
          <span class="card-title">${cat.title}</span>
          <div class="card-btns">
            <button class="btn-open">Ver catalogo</button>
            <a class="btn-dl-card" href="${url}" download title="Baixar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            </a>
          </div>
        </div>`;
      $('shelf').appendChild(card);

      const canvas = card.querySelector('.card-thumb');
      try {
        const pdf  = await pdfjsLib.getDocument(url).promise;
        const page = await pdf.getPage(1);
        const vp   = page.getViewport({ scale: 0.55 });
        canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      } catch {
        canvas.width = 200; canvas.height = 280;
        const tc = canvas.getContext('2d');
        tc.fillStyle = '#f0e8d8'; tc.fillRect(0,0,200,280);
        tc.font='52px serif'; tc.textAlign='center'; tc.fillText('📄',100,155);
        tc.fillStyle='#b8900a'; tc.font='bold 12px sans-serif'; tc.fillText('Em breve',100,200);
      }

      const open = () => openModal(url, cat.title);
      card.querySelector('.btn-open').addEventListener('click', e => { e.stopPropagation(); open(); });
      card.addEventListener('click', open);
      card.addEventListener('keypress', e => e.key==='Enter' && open());
    }

    async function openModal(url, title) {
      $('modalTitle').textContent = title;
      $('modalDownload').href = url;
      currentPage = 1; curScale = fitScale();
      $('modal').style.display   = 'flex';
      $('modalOverlay').style.display = 'block';
      document.body.style.overflow = 'hidden';
      const h = $('swipeHint');
      h.style.display = 'block'; h.style.opacity = '1';
      setTimeout(() => { h.style.opacity = '0'; setTimeout(()=>{ h.style.display='none'; },600); }, 2000);
      try {
        currentPdf = await pdfjsLib.getDocument(url).promise;
        totalPages = currentPdf.numPages;
        $('pageTotal').textContent = totalPages;
        await renderPage(1);
      } catch { alert('Nao foi possivel abrir o catalogo.'); closeModal(); }
    }

    function closeModal() {
      $('modal').style.display = 'none';
      $('modalOverlay').style.display = 'none';
      document.body.style.overflow = '';
      currentPdf = null;
    }

    async function renderPage(n) {
      if (!currentPdf) return;
      if (renderTask) { try { renderTask.cancel(); } catch {} renderTask = null; }
      $('renderSpinner').style.display = 'flex';
      $('pageNum').textContent = n;
      $('btnPrev').disabled = n <= 1;
      $('btnNext').disabled = n >= totalPages;
      try {
        const page = await currentPdf.getPage(n);
        const vp   = page.getViewport({ scale: curScale });
        const c = $('pdfCanvas');
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        renderTask = page.render({ canvasContext: c.getContext('2d'), viewport: vp });
        await renderTask.promise;
      } catch(e) { if(e?.name!=='RenderingCancelledException') console.error(e); }
      finally { $('renderSpinner').style.display='none'; renderTask=null; }
    }

    function fitScale() { return +(Math.min(window.innerWidth-16,760)/595).toFixed(2); }
    function goTo(n) { currentPage = Math.max(1,Math.min(n,totalPages)); renderPage(currentPage); }

    $('modalClose').addEventListener('click', closeModal);
    $('modalOverlay').addEventListener('click', closeModal);
    $('btnPrev').addEventListener('click', () => goTo(currentPage-1));
    $('btnNext').addEventListener('click', () => goTo(currentPage+1));
    $('btnZoomIn').addEventListener('click',  () => { curScale=Math.min(curScale+0.25,3.5); renderPage(currentPage); });
    $('btnZoomOut').addEventListener('click', () => { curScale=Math.max(curScale-0.25,0.4); renderPage(currentPage); });
    $('btnFit').addEventListener('click',     () => { curScale=fitScale(); renderPage(currentPage); });

    const cw = $('canvasWrap');
    cw.addEventListener('touchstart', e => { touchX0 = e.touches[0].clientX; }, {passive:true});
    cw.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - touchX0;
      if (Math.abs(dx) > 45) goTo(dx < 0 ? currentPage+1 : currentPage-1);
    }, {passive:true});

    document.addEventListener('keydown', e => {
      if ($('modal').style.display==='none') return;
      if (e.key==='ArrowRight'||e.key==='ArrowDown') goTo(currentPage+1);
      if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   goTo(currentPage-1);
      if (e.key==='Escape') closeModal();
    });

    buildShelf();
  </script>

  <footer class="footer">&#169; 2025 Vanessa Pessanha Acessorios</footer>
</body>
</html>
