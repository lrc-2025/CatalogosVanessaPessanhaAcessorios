<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogos | Vanessa Pessanha Acessórios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#1a1410">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>

  <header class="header">
    <img src="img/logo.png" alt="Logo Vanessa Pessanha" class="header-logo"
         onerror="this.style.display='none'">
    <div class="header-text">
      <h1>Catálogos</h1>
      <p>Vanessa Pessanha Acessórios</p>
    </div>
    <a class="whatsapp-btn" href="https://wa.me/5522999882600" target="_blank"
       rel="noopener noreferrer" title="Fale no WhatsApp" aria-label="Fale no WhatsApp">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
    </a>
  </header>

  <main class="main">
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Carregando catálogos…</p>
    </div>
    <div id="empty" class="empty-state" style="display:none">
      <span class="empty-icon">📂</span>
      <p>Nenhum catálogo publicado ainda.</p>
      <small>Em breve novos catálogos estarão disponíveis.</small>
    </div>
    <div id="shelf" class="shelf"></div>
  </main>

  <!-- MODAL VISUALIZADOR -->
  <div id="modal" class="modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <span id="modalTitle" class="modal-title"></span>
      <div class="modal-actions">
        <a id="modalDownload" class="btn-icon-action" title="Baixar PDF" aria-label="Baixar PDF" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="17" height="17" aria-hidden="true">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
        </a>
        <button id="modalClose" class="btn-icon-action" title="Fechar" aria-label="Fechar">&#10005;</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="viewer-toolbar">
        <button id="btnPrev" class="nav-btn" title="Página anterior" aria-label="Página anterior">&#8249;</button>
        <span class="page-info">
          <span id="pageNum">1</span>&nbsp;/&nbsp;<span id="pageTotal">1</span>
        </span>
        <button id="btnNext" class="nav-btn" title="Próxima página" aria-label="Próxima página">&#8250;</button>
        <button id="btnZoomOut" class="zoom-btn" aria-label="Reduzir zoom">&#8722;</button>
        <button id="btnFit"    class="zoom-btn" title="Ajustar à tela" aria-label="Ajustar à tela">&#8861;</button>
        <button id="btnZoomIn" class="zoom-btn" aria-label="Aumentar zoom">&#43;</button>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="pdfCanvas"></canvas>
        <div id="renderSpinner" class="render-spinner" style="display:none">
          <div class="spinner small"></div>
        </div>
      </div>
      <p class="swipe-hint" id="swipeHint" aria-hidden="true">&#8592; Deslize para navegar &#8594;</p>
    </div>
  </div>
  <div id="modalOverlay" class="modal-overlay" style="display:none"></div>

  <script type="module">
    import * as pdfjsLib from './libs/pdfjs/pdf.js';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './libs/pdfjs/pdf.worker.js';

    const pdfDir = 'catalogos/';

    let currentPdf  = null, currentPage = 1, totalPages = 1;
    let curScale    = 1.0, renderTask = null, touchX0 = 0;
    const $id = id => document.getElementById(id);

    /* ── Carregar lista de catálogos ── */
    async function loadCatalogos() {
      try {
        const r = await fetch('catalogos.json?t=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    /* ── Montar prateleira ── */
    async function buildShelf() {
      const catalogos = await loadCatalogos();

      $id('loading').style.display = 'none';
      if (!catalogos.length) {
        $id('empty').style.display = 'flex';
        return;
      }

      await Promise.all(catalogos.map(buildCard));
    }

    async function buildCard(cat) {
      const url  = pdfDir + cat.file;
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', 'Abrir ' + cat.title);

      /* thumbnail */
      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'card-thumb-wrap';
      const thumb = document.createElement('canvas');
      thumb.className = 'card-thumb';
      const badge = document.createElement('span');
      badge.className = 'card-badge';
      badge.textContent = 'PDF';
      thumbWrap.appendChild(thumb);
      thumbWrap.appendChild(badge);

      /* info */
      const info = document.createElement('div');
      info.className = 'card-info';
      const titleEl = document.createElement('span');
      titleEl.className = 'card-title';
      titleEl.textContent = cat.title;   /* textContent — sem XSS */
      const btns = document.createElement('div');
      btns.className = 'card-btns';
      const btnOpen = document.createElement('button');
      btnOpen.className = 'btn-open';
      btnOpen.textContent = 'Ver catálogo';
      const btnDl = document.createElement('a');
      btnDl.className = 'btn-dl';
      btnDl.href = url;
      btnDl.download = '';
      btnDl.title = 'Baixar';
      btnDl.setAttribute('aria-label', 'Baixar ' + cat.title);
      btnDl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>';
      btns.appendChild(btnOpen);
      btns.appendChild(btnDl);
      info.appendChild(titleEl);
      info.appendChild(btns);

      card.appendChild(thumbWrap);
      card.appendChild(info);
      $id('shelf').appendChild(card);

      /* miniatura via PDF.js */
      try {
        const pdf  = await pdfjsLib.getDocument(url).promise;
        const page = await pdf.getPage(1);
        const vp   = page.getViewport({ scale: 0.5 });
        thumb.width  = vp.width;
        thumb.height = vp.height;
        await page.render({ canvasContext: thumb.getContext('2d'), viewport: vp }).promise;
      } catch {
        thumb.width  = 180;
        thumb.height = 250;
        const tc = thumb.getContext('2d');
        tc.fillStyle = '#faf3e5';
        tc.fillRect(0, 0, 180, 250);
        tc.font = '52px serif';
        tc.textAlign = 'center';
        tc.fillText('📄', 90, 145);
        tc.fillStyle = '#c8973a';
        tc.font = 'bold 11px sans-serif';
        tc.fillText('Em breve', 90, 195);
      }

      const open = () => openModal(url, cat.title);
      btnOpen.addEventListener('click', e => { e.stopPropagation(); open(); });
      card.addEventListener('click', open);
      card.addEventListener('keypress', e => { if (e.key === 'Enter') open(); });
    }

    /* ── Modal visualizador ── */
    async function openModal(url, title) {
      $id('modalTitle').textContent = title;
      $id('modalDownload').href = url;
      currentPage = 1;
      curScale    = fitScale();
      $id('modal').style.display   = 'flex';
      $id('modalOverlay').style.display = 'block';
      document.body.style.overflow = 'hidden';

      const hint = $id('swipeHint');
      hint.style.display  = 'block';
      hint.style.opacity  = '1';
      setTimeout(() => {
        hint.style.transition = 'opacity .6s';
        hint.style.opacity    = '0';
        setTimeout(() => { hint.style.display = 'none'; hint.style.transition = ''; }, 650);
      }, 2200);

      try {
        currentPdf = await pdfjsLib.getDocument(url).promise;
        totalPages = currentPdf.numPages;
        $id('pageTotal').textContent = totalPages;
        await renderPage(1);
      } catch {
        alert('Não foi possível abrir o catálogo.');
        closeModal();
      }
    }

    function closeModal() {
      $id('modal').style.display        = 'none';
      $id('modalOverlay').style.display = 'none';
      document.body.style.overflow      = '';
      currentPdf = null;
    }

    async function renderPage(n) {
      if (!currentPdf) return;
      if (renderTask) { try { renderTask.cancel(); } catch {} renderTask = null; }
      $id('renderSpinner').style.display = 'flex';
      $id('pageNum').textContent = n;
      $id('btnPrev').disabled = n <= 1;
      $id('btnNext').disabled = n >= totalPages;
      try {
        const page = await currentPdf.getPage(n);
        const vp   = page.getViewport({ scale: curScale });
        const c    = $id('pdfCanvas');
        c.width  = Math.floor(vp.width);
        c.height = Math.floor(vp.height);
        renderTask = page.render({ canvasContext: c.getContext('2d'), viewport: vp });
        await renderTask.promise;
      } catch (e) {
        if (e?.name !== 'RenderingCancelledException') console.error(e);
      } finally {
        $id('renderSpinner').style.display = 'none';
        renderTask = null;
      }
    }

    function fitScale()   { return +(Math.min(window.innerWidth - 16, 760) / 595).toFixed(2); }
    function goTo(n)      { currentPage = Math.max(1, Math.min(n, totalPages)); renderPage(currentPage); }

    $id('modalClose').addEventListener('click',    closeModal);
    $id('modalOverlay').addEventListener('click',  closeModal);
    $id('btnPrev').addEventListener('click',  () => goTo(currentPage - 1));
    $id('btnNext').addEventListener('click',  () => goTo(currentPage + 1));
    $id('btnZoomIn').addEventListener('click',  () => { curScale = Math.min(curScale + 0.25, 3.5); renderPage(currentPage); });
    $id('btnZoomOut').addEventListener('click', () => { curScale = Math.max(curScale - 0.25, 0.4); renderPage(currentPage); });
    $id('btnFit').addEventListener('click',     () => { curScale = fitScale(); renderPage(currentPage); });

    const cw = $id('canvasWrap');
    cw.addEventListener('touchstart', e => { touchX0 = e.touches[0].clientX; }, { passive: true });
    cw.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - touchX0;
      if (Math.abs(dx) > 45) goTo(dx < 0 ? currentPage + 1 : currentPage - 1);
    }, { passive: true });

    document.addEventListener('keydown', e => {
      if ($id('modal').style.display === 'none') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(currentPage + 1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(currentPage - 1);
      if (e.key === 'Escape') closeModal();
    });

    buildShelf();
  </script>

  <footer class="footer">
    <span>&#169; 2025 Vanessa Pessanha Acessórios</span>
    <a href="admin.html" class="admin-link" title="Gerenciar catálogos">&#9881; Admin</a>
  </footer>

</body>
</html>
